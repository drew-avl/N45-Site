name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate assets directory index
        uses: gacts/directory-listing@v1
        with:
          target: ./public/assets
          overwrite: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          VITE_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
          VITE_BOOKING_URL: ${{ vars.BOOKING_URL }}
          VITE_SECURITY_TRIAGE_BOOKING_URL: ${{ vars.SECURITY_TRIAGE_BOOKING_URL }}
          VITE_IT_REVIEW_BOOKING_URL: ${{ vars.IT_REVIEW_BOOKING_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
